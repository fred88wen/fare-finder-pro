name: Keep Supabase Alive

# Supabase 免費方案的專案閒置一段時間會自動暫停（連 API 網域都連不上）。
# 2026-11-03：舊版只打 /auth/v1/health，Supabase 不算活動，9 月底被暫停。
# 改成「假帳號登入」後仍無效：11/7 探測成功、11/10 已被暫停（2026-11-18 查到）。
# 2026-11-18：改成透過資料表 API 讀 public.keepalive（只有一列、只開放讀取），
# 這是走 PostgREST 的真 SQL 查詢；頻率由每 3 天改為每天。
# 還原：在 Supabase SQL 執行 drop table public.keepalive; 並還原本檔。
on:
  schedule:
    - cron: "0 3 * * *" # 每天 UTC 03:00（胡志明 10:00）
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 讀一次 keepalive 資料表（真的資料庫查詢）
        id: probe
        env:
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          body=$(curl -s --max-time 30 -w "\n%{http_code}" \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" \
            "https://yxbubgxrfudfpaomwccd.supabase.co/rest/v1/keepalive?select=id&limit=1") || true
          code=$(echo "$body" | tail -n1)
          echo "http_code=$code"
          echo "$body" | head -n1
          if [ "$code" = "200" ] && echo "$body" | grep -q '"id"'; then
            echo "資料庫有回應，保活成功"
          else
            echo "::error::Supabase 資料庫探測異常（回 ${code:-連線失敗}），專案可能已被暫停。請到 Supabase 後台按 Restore project，並確認 shop.goboss.tw 登入功能。"
            exit 1
          fi

      # 有設 Telegram 金鑰才發，沒設就略過（不影響紅燈與失敗信）
      - name: 異常時發 Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "未設定 Telegram 金鑰，略過通知"; exit 0
          fi
          curl -sS -f -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=[機票比價站] Supabase 資料庫探測失敗，專案可能被暫停。請到 Supabase 後台 Restore project。" > /dev/null
